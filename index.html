<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>🌿 민티의 하루 🌿</title>

  <link rel="shortcut icon" href="icon-180.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-180.png">
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#A3B18A" />
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="민티의 하루">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root {
  --bg:#F6F7F2; --card:#fff; --text:#2F3E34; --sub:#7A8B7A;
  --accent:#A3B18A; --warn:#D9776C; --warn-strong:#C44536;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#1f2320; --card:#2a2f2b; --text:#e5e7e3; --sub:#aab0a5; }
}
* { box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color:transparent; }
body {
  margin:0; background:var(--bg); color:var(--text);
  padding: env(safe-area-inset-top) 20px calc(env(safe-area-inset-bottom) + 20px);
  min-height: 100vh; overscroll-behavior-y: none;
  -webkit-user-select: none; user-select: none; overflow-x: hidden;
}
h1 { display: block; width: fit-content; margin: 30px auto 0; padding: 12px 28px; font-size: 32px; font-weight: 850; letter-spacing: -1px; background: rgba(163, 177, 138, 0.15); border-radius: 100px; color: var(--text); }
.subtitle { text-align: center; font-size: 13px; color: var(--sub); margin: 8px 0 24px; }
.status { text-align:center; padding:16px; border-radius:18px; background: rgba(163, 177, 138, 0.15); font-size:14px; margin-bottom:20px; transition: 0.3s ease; line-height: 1.6; }
.status.warn { background:#f7e6e3; color:var(--warn-strong); font-weight: 600; }
.card { scroll-margin-top: 80px; background:var(--card); border-radius:24px; padding:22px; margin-bottom:16px; box-shadow: 0 6px 20px rgba(0,0,0,0.04); cursor: pointer; border: 1.5px solid transparent; transition: transform 0.2s ease; }
.card.warn { border: 1.5px solid var(--warn); }
.card-header { display:flex; align-items:center; justify-content: space-between; }
.icon-emoji { font-size: 32px; animation: breathe 3.2s ease-in-out infinite; display: inline-block; }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
.stock strong { font-size:26px; font-weight:700; color: var(--accent); }
.stock.warn strong { color:var(--warn-strong); }
@keyframes heartPop {
  0% { transform: scale(0) translateY(0) rotate(0); opacity: 1; }
  100% { transform: scale(1.2) translateY(-100px) rotate(45deg); opacity: 0; }
}
.heart-particle {
  position: fixed; pointer-events: none; z-index: 10001; font-size: 20px;
  animation: heartPop 1s ease-out forwards;
}
/* 최근 이력 스타일 */
.history-container { background: rgba(0,0,0,0.03); border-radius: 12px; padding: 12px; margin: 10px 0 15px; }
@media (prefers-color-scheme: dark) { .history-container { background: rgba(255,255,255,0.05); } }
.history-item { font-size: 12px; display: flex; justify-content: space-between; margin-bottom: 4px; color: var(--text); }

.edit-form { max-height: 0; overflow: hidden; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); opacity: 0; }
.card.open .edit-form { max-height: 800px; opacity: 1; margin-top: 18px; padding-top: 18px; border-top: 1px dashed rgba(0,0,0,0.1); }

/* 입력창 스타일 고정 */
.date-display { background: rgba(0,0,0,0.04); color: var(--sub); padding: 14px; border-radius: 14px; font-size: 16px; margin-top: 8px; border: 1px solid rgba(0,0,0,0.05); }
@media (prefers-color-scheme: dark) { .date-display { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); } }

input, button { width:100%; padding:14px; border-radius:14px; margin-top:8px; font-size:16px; border:none; outline: none; }
input { background: rgba(0,0,0,0.04); color: var(--text); border: 1px solid transparent; }
input:focus { border: 1px solid var(--accent); }
@media (prefers-color-scheme: dark) { input { background: rgba(255,255,255,0.06); } }

button { background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
.overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999; opacity: 0; visibility: hidden; transition: 0.4s ease; }
.overlay.show { opacity: 1; visibility: visible; }
@keyframes fadeInOut { 0% { opacity: 0; transform: translate(-50%, -60%); } 20%, 80% { opacity: 1; transform: translate(-50%, -50%); } 100% { opacity: 0; transform: translate(-50%, -40%); } }
</style>
</head>
<body>

<div id="overlay" class="overlay">
  <div style="text-align:center; max-width:300px;">
    <h2 style="font-size:40px; font-weight:850; margin-bottom:12px;">🌿 민티의 하루 🌿</h2>
    <p style="font-size:14px; color:var(--sub); line-height:1.8; margin-bottom:24px;">✍️ 작은 기록 속에 남기는 너를 향한 나의 온도</p>
    <button onclick="start()">시작하기</button>
  </div>
</div>

<h1>🌿 민티의 하루 🌿</h1>
<div class="subtitle">오늘도 행복할 민티를 위해 ☺️</div>
<div id="status" class="status"></div>
<div id="cards"></div>

<footer>
  <div style="text-align:center; font-size:11px; color:var(--sub); margin-top:40px; padding-bottom:40px;">
    숫자가 전하지 못하는 것들 <br>
    <span id="today-footer" style="opacity:0.5;"></span>
  </div>
</footer>

<script>
const supplements = [
  { key: "pro", name: "유산균", icon: '🦠', desc: "민티의 시작이 조금 더 가벼워지기를" },
  { key: "vit", name: "종합비타민", icon: '💊', desc: "민티의 하루가 조금 더 든든해지기를" },
  { key: "omg", name: "오메가3", icon: '🐟', desc: "민티의 마음이 조금 더 유연해지기를" },
  { key: "col", name: "콜라겐", icon: '✨', desc: "민티의 내일이 조금 더 반짝이기를" }
];

function getTodayKST() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getDiffDays(dateStr) {
  if (!dateStr) return 0;
  const today = new Date();
  const t = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const p = new Date(dateStr);
  const pd = new Date(p.getFullYear(), p.getMonth(), p.getDate());
  return Math.floor((t - pd) / 86400000);
}

function get(k){ return JSON.parse(localStorage.getItem('minty_'+k)); }
function set(k,v){ localStorage.setItem('minty_'+k, JSON.stringify(v)); }

function render() {
   const randomMessages = [
      "🌱 오늘은 명상하기 좋은 날", 
      "🏃‍♂️ 네가 걷는 모든 길을 응원해", 
      "🍀 오늘의 하루는 유난히 너에게 다정할거야", 
      "💫 눈부신 새벽의 샛별같은 너", 
      "☀️ 세상에서 가장 소중한 너", 
      "🌸 네가 걷는 모든 길에 꽃이 피길", 
      "🌊 민티의 오늘이 잔잔한 윤슬처럼 빛나길",
      "🌙 민티의 오늘 밤이 포근하길",
      "🩵 기록 속에 담긴 내 진심이 너에게 닿기를",
      "🤭 네가 웃을 때 나는 가장 행복해",
      "🧚‍♀️ 기분좋은 바람처럼 완벽한 하루가 될거야"
  ];
// 이전에 선언된 게 있다면 무작위로 하나 선택
  const randomMsg = randomMessages[Math.floor(Math.random() * randomMessages.length)];
  const wrap = document.getElementById("cards");
  wrap.innerHTML = "";
  let warnCount = 0;
  const todayKST = getTodayKST();
  const dateParts = todayKST.split('-'); // ['2026', '01', '30'] 분리
  const displayDateFull = `${dateParts[0]}년 ${dateParts[1]}월 ${dateParts[2]}일`;
  const displayDateShort = `${dateParts[1]}월 ${dateParts[2]}일`; // 카드 내부용

  supplements.forEach(s => {
    const d = get(s.key) || { total: 0, lastDate: todayKST, history: [] };
    const diff = getDiffDays(d.lastDate);
    const remain = Math.max(d.total - diff, 0);
    const isWarn = remain <= 30;
    if (isWarn) warnCount++;

    // 히스토리 HTML 생성
    let historyHtml = "";
    if (d.history && d.history.length > 0) {
      historyHtml = `<div class="history-container">`;
      d.history.slice(0, 3).forEach(h => {
        historyHtml += `<div class="history-item"><span>📦 ${h.date.slice(5).replace('-', '월 ')}일</span><span>${h.qty}개 충전</span></div>`;
      });
      historyHtml += `</div>`;
    }

    const card = document.createElement("div");
    card.className = `card ${isWarn ? 'warn' : ''}`;
card.onclick = (e) => {
  if (e.target.closest('.edit-form')) return;
  const isOpen = card.classList.contains('open');
  document.querySelectorAll('.card').forEach(c => c.classList.remove('open'));

  if (!isOpen) {
    card.classList.add('open');
    setTimeout(() => {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 300); 
  }
};

    card.innerHTML = `
      <div class="card-header">
        <div style="display:flex; align-items:center; gap:12px;">
          <span class="icon-emoji">${s.icon}</span>
          <span style="font-weight:700; font-size:17px;">${s.name}</span>
        </div>
        <div class="stock ${isWarn?'warn':''}"><strong>${remain}</strong> <span style="font-size:14px; color:var(--sub);">개</span></div>
      </div>
      <div style="font-size:12px; color:var(--sub); margin:4px 0 14px;">${s.desc}</div>
      <div class="edit-form">
        <div style="font-size:12px; color:var(--sub); margin-bottom:4px;">쌓아온 날들</div>
        ${historyHtml || '<div style="font-size:11px; color:var(--sub); margin-bottom:15px; opacity:0.6;">아직 남겨진 게 없어요. ✨</div>'}
        
        <div style="font-size:12px; color:var(--sub); margin-bottom:4px">오늘 담은 마음</div>
        <div class="date-display">${displayDateShort}</div>
        <input type="number" inputmode="numeric" placeholder="개수" id="${s.key}q">
        
        <div style="font-size:12px; color:var(--sub); margin:12px 0 4px">현재에 맞춰두기</div>
        <input type="number" inputmode="numeric" placeholder="현재 개수" id="${s.key}total">
        <button onclick="save('${s.key}', event)">충전하기 🩵</button>
      </div>`;
    wrap.appendChild(card);
  });

  const st = document.getElementById("status");
  st.className = "status" + (warnCount ? " warn" : "");
  st.innerText = warnCount ? `⚠️ 민티를 위해 다시 채워줄 조각이 ${warnCount}개 필요해요` : randomMsg;
  document.getElementById("today-footer").innerText = displayDateFull;
}

function save(k, e) {
  e.preventDefault(); e.stopPropagation();
  const qVal = document.getElementById(k+"q").value;
  const tVal = document.getElementById(k+"total").value;
  const today = getTodayKST();
  const prev = get(k) || { total: 0, lastDate: today, history: [] };

  if (qVal && tVal) { alert("한 가지만 입력해주세요 🩵"); return; }
  
  if (tVal !== "") {
    prev.total = Math.floor(Number(tVal));
    prev.lastDate = today;
  } else if (qVal !== "") {
    const current = Math.max(prev.total - getDiffDays(prev.lastDate), 0);
    const q = Math.floor(Number(qVal));
    prev.total = current + q;
    prev.lastDate = today;
    prev.history = [{ date: today, qty: q }, ...(prev.history||[])].slice(0,10);
  } else { alert("수량을 입력해주세요 🩵"); return; }

  set(k, prev);
  render();
  showToast();
  if (navigator.vibrate) navigator.vibrate(10);
}

function showToast() {
  // 기존 토스트 로직 유지 후 하트 생성 코드 추가
  for (let i = 0; i < 8; i++) {
    const heart = document.createElement('div');
    heart.className = 'heart-particle';
    heart.innerText = i % 2 === 0 ? '🩵' : '💕';
    heart.style.left = (50 + (Math.random() * 40 - 20)) + '%'; // 화면 중앙 근처 랜덤
    heart.style.top = (50 + (Math.random() * 20 - 10)) + '%';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 1000);
  }
  const t = document.createElement('div');
  t.style.cssText = "position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#A3B18A; color:#fff; padding:16px 32px; border-radius:20px; z-index:10000; animation:fadeInOut 1.5s ease; pointer-events:none; font-weight:600; box-shadow: 0 8px 24px rgba(0,0,0,0.2);";
  t.innerText = "🩵 충전 완료!";
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1500);
}

function start() {
  document.getElementById("overlay").classList.remove("show");
  setTimeout(() => { document.getElementById("overlay").style.display = "none"; }, 400);
}

window.onload = () => {
  render();
  setTimeout(() => document.getElementById("overlay").classList.add("show"), 100);
};

document.addEventListener('click', (e) => {
  if (!e.target.closest('.card') && !e.target.closest('button') && !e.target.closest('.overlay')) {
    document.activeElement.blur();
    document.querySelectorAll('.card.open').forEach(c => c.classList.remove('open'));
  }
});
</script>
</body>
</html>
