<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<title>🌿 민티의 하루 🌿</title>

<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#A3B18A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="민티의 하루">

<style>
:root{
 --bg:#F6F7F2;
 --card:#ffffff;
 --text:#2F3E34;
 --sub:#7A8B7A;
 --accent:#A3B18A;
 --warn:#D9776C;
}

*{box-sizing:border-box;font-family:-apple-system,"Noto Sans KR",sans-serif}

body{
 margin:0;
 padding:20px;
 background:var(--bg);
 color:var(--text);
}

h1{
 text-align:center;
 font-size:24px;
 margin:6px 0 4px;
}

.subtitle{
 text-align:center;
 font-size:13px;
 color:var(--sub);
 margin-bottom:14px;
}

.minty-msg{
 text-align:center;
 font-size:14px;
 background:#eef1ea;
 padding:10px;
 border-radius:14px;
 margin-bottom:16px;
}

.status{
 text-align:center;
 padding:10px;
 border-radius:14px;
 background:#eef1ea;
 font-size:14px;
 margin-bottom:16px;
}
.status.warn{background:#f7e6e3;color:var(--warn)}

.card{
 background:var(--card);
 border-radius:20px;
 padding:18px;
 margin-bottom:14px;
 box-shadow:0 6px 16px rgba(0,0,0,.05);
 position:relative;
 overflow:hidden;
}

.card.warn{border:1.5px solid var(--warn)}

.icon{
 font-size:34px;
 line-height:1;
 margin-bottom:6px;
 animation:breathe 3.2s ease-in-out infinite;
}

@keyframes breathe{
 0%{transform:scale(1)}
 50%{transform:scale(1.08)}
 100%{transform:scale(1)}
}

.title{
 font-size:17px;
 font-weight:600;
 display:flex;
 align-items:center;
 gap:8px;
}

.desc{
 font-size:12px;
 color:var(--sub);
 margin:6px 0 12px;
}

.stock{
 font-size:13px;
}
.stock strong{
 font-size:22px;
}
.stock.warn{color:var(--warn)}

input,button{
 width:100%;
 padding:10px;
 border-radius:12px;
 margin-top:8px;
 font-size:14px;
}

input{border:1px solid #ddd}
button{
 background:var(--accent);
 color:white;
 border:none;
 font-weight:600;
}

footer{
 text-align:center;
 font-size:12px;
 color:var(--sub);
 margin-top:28px;
}
</style>
</head>

  <style>
    :root {
      --bg:#F6F7F2;
      --card:#fff;
      --text:#2F3E34;
      --sub:#7A8B7A;
      --accent:#A3B18A;
      --warn:#D9776C;
      --warn-strong:#C44536;
    }

    * { box-sizing:border-box; font-family:-apple-system,"Noto Sans KR",sans-serif; }

    body {
      margin:0;
      background:var(--bg);
      color:var(--text);
      padding:20px;
    }

    h1 { text-align:center; font-size:24px; margin:0; }
    .subtitle { text-align:center; font-size:13px; color:var(--sub); margin:6px 0 20px; }

    .status {
      text-align:center;
      padding:10px;
      border-radius:12px;
      background:#eef1ea;
      font-size:14px;
      margin-bottom:16px;
    }
    .status.warn { background:#f7e6e3; color:var(--warn-strong); }

    .card {
      background:var(--card);
      border-radius:18px;
      padding:16px;
      margin-bottom:14px;
      box-shadow:0 4px 12px rgba(0,0,0,.04);
    }
    .card.warn { border:1.5px solid var(--warn); }

    .title { font-size:16px; font-weight:600; }
    .desc { font-size:12px; color:var(--sub); margin:4px 0 12px; }

    .stock strong { font-size:20px; }
    .stock.warn { color:var(--warn-strong); }

    .small { font-size:12px; color:var(--sub); margin-top:6px; }

    input,button {
      width:100%; padding:10px; border-radius:10px; margin-top:8px;
      font-size:14px;
    }
    input { border:1px solid #ddd; }
    button {
      background:var(--accent);
      color:#fff;
      border:none;
      font-weight:600;
    }

    footer { text-align:center; font-size:12px; color:var(--sub); margin-top:24px; }

    /* First launch overlay */
    .overlay {
      position:fixed;
      inset:0;
      background:rgba(246,247,242,.96);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      z-index:10;
    }
    .welcome {
      text-align:center;
      max-width:320px;
    }
    .welcome h2 { font-size:22px; margin-bottom:12px; }
    .welcome p { font-size:14px; color:var(--sub); line-height:1.6; }
  </style>
</head>

<body>

<div id="overlay" class="overlay" style="display:none">
  <div class="welcome">
    <h2>🌿 민티의 하루 🌿</h2>
    <p>
      오늘도 행복할 민티를 위해<br>
      작은 기록 속에 남기는 나의 온도 
    </p>
    <button onclick="start()">시작하기</button>
  </div>
</div>

<h1>🌿 민티의 하루 🌿</h1>
<div class="subtitle">아프지 않았으면 하는 마음으로</div>

<div id="status" class="status"></div>
<div id="cards"></div>

<footer>숫자가 말하지 못하는 것들</footer>

<script>
const supplements = [
  {
    key: "pro",
    name: "유산균",
    icon: '🦠',
    color: "bg-blue-50",
    desc: "아침 공복, 따뜻한 물과 함께"
  },
  {
    key: "vit",
    name: "종합비타민",
    icon: '💊',
    color: "bg-yellow-50",
    desc: "점심 식후, 잊지 말고 챙기기"
  },
  {
    key: "omg",
    name: "오메가3",
    icon: '🐟',
    color: "bg-orange-50",
    desc: "점심 식후, 잊지 말고 챙기기"
  },
  {
    key: "col",
    name: "콜라겐",
    icon: '✨',
    color: "bg-pink-50",
    desc: "오늘 하루를 마무리하며"
  }
];

function days(d){return Math.floor((new Date()-new Date(d))/(86400000));}
function get(k){return JSON.parse(localStorage.getItem(k));}
function set(k,v){localStorage.setItem(k,JSON.stringify(v));}

function render(){
 let warn=0,wrap=document.getElementById("cards");
 wrap.innerHTML="";
 supplements.forEach(s=>{
  let d=get(s.key),remain="-";
  if(d){remain=Math.max(d.qty-days(d.date),0); if(remain<=60) warn++;}
  let c=document.createElement("div");
  c.className="card"+(remain!=="-"&&remain<=60?" warn":"");
  c.innerHTML=`
   <div class="title">${s.name}</div>
   <div class="desc">${s.desc}</div>
   <div class="stock ${remain<=60?"warn":""}">
    남은 수량<br><strong>${remain}</strong> 개 ${remain<=60?"⚠️":""}
   </div>
   <div class="small">${remain<=60?"슬슬 준비할 시간🏃":"당분간은 걱정 없어☀️"}</div>
   <input type="date" id="${s.key}d">
   <input type="number" placeholder="구매 수량" id="${s.key}q">
   <button onclick="save('${s.key}')">저장하기 💾</button>`;
  wrap.appendChild(c);
 });
 let st=document.getElementById("status");
 st.className="status"+(warn?" warn":"");
 st.innerText=warn?`⚠️ 준비가 필요한 영양제가 ${warn}개 있어요`:"😊 오늘은 마음 놓아도 괜찮아";
}

function save(k){
 let d=document.getElementById(k+"d").value;
 let q=document.getElementById(k+"q").value;
 if(d&&q){set(k,{date:d,qty:+q});render();}
}

function start(){
 localStorage.setItem("minty_started","yes");
 document.getElementById("overlay").style.display="none";
}

if(!localStorage.getItem("minty_started")){
 document.getElementById("overlay").style.display="flex";
}

render();
</script>

</body>
</html>
