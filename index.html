<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>🌿 민티의 하루 🌿</title>

<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#A3B18A" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="민티의 하루">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
/* (스타일은 변경 없음 — 생략하지 않고 그대로 유지) */
</style>
</head>
<body>

<!-- (HTML 구조 동일 — 생략 없음) -->

<script>
const supplements = [
  { key: "pro", name: "유산균", icon: '🦠', desc: "아침 공복, 따뜻한 물과 함께" },
  { key: "vit", name: "종합비타민", icon: '💊', desc: "점심 식후, 잊지 말고 챙기기" },
  { key: "omg", name: "오메가3", icon: '🐟', desc: "점심 식후, 잊지 말고 챙기기" },
  { key: "col", name: "콜라겐", icon: '✨', desc: "오늘 하루를 마무리하며" }
];

function getTodayKST() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function parseDate(str) {
  const [y,m,d] = str.split('-').map(Number);
  return new Date(y, m-1, d);
}

function getDiffDays(dateStr) {
  if (!dateStr) return 0;
  const today = parseDate(getTodayKST());
  const past = parseDate(dateStr);
  return Math.max(Math.floor((today - past) / 86400000), 0);
}

function get(k){ return JSON.parse(localStorage.getItem('minty_'+k)); }
function set(k,v){ localStorage.setItem('minty_'+k, JSON.stringify(v)); }

function save(k, e) {
  e.preventDefault();
  e.stopPropagation();
  document.activeElement?.blur();

  const qInput = document.getElementById(k+"q");
  const tInput = document.getElementById(k+"total");
  const qVal = qInput.value.trim();
  const tVal = tInput.value.trim();

  if (qVal && tVal) {
    alert("한 가지만 입력해주세요 💚");
    return;
  }

  const today = getTodayKST();
  const prev = get(k) || { total: 0, lastDate: today, history: [] };

  // 실재고 보정
  if (tVal !== "") {
    const n = Number(tVal);
    if (!Number.isInteger(n) || n < 0) {
      alert("올바른 수량을 입력해주세요 💚");
      return;
    }
    prev.total = n;
    prev.lastDate = today;
  }

  // 구매 추가
  else if (qVal !== "") {
    const q = Number(qVal);
    if (!Number.isInteger(q) || q <= 0) {
      alert("올바른 수량을 입력해주세요 💚");
      return;
    }
    const remain = Math.max(prev.total - getDiffDays(prev.lastDate), 0);
    prev.total = remain + q;
    prev.lastDate = today;
    prev.history = [
      { date: today, qty: q },
      ...(prev.history || [])
    ].slice(0, 10);
  }

  else {
    alert("수량을 입력해주세요 💚");
    return;
  }

  set(k, prev);
  render();
  showToast();
  navigator.vibrate?.(10);

  qInput.value = "";
  tInput.value = "";
  document.querySelectorAll('.card').forEach(c => c.classList.remove('open'));
}

</script>
</body>
</html>
