<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>🌿 민티의 하루 🌿</title>

  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#A3B18A" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="민티의 하루">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">  
  
<style>
:root {
  --bg:#F6F7F2; --card:#fff; --text:#2F3E34; --sub:#7A8B7A;
  --accent:#A3B18A; --warn:#D9776C; --warn-strong:#C44536;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#1f2320; --card:#2a2f2b; --text:#e5e7e3; --sub:#aab0a5; }
}

* { box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color:transparent; }

body {
  margin:0; background:var(--bg); color:var(--text);
  padding: env(safe-area-inset-top) 20px calc(env(safe-area-inset-bottom) + 20px);
  min-height: 100vh; overscroll-behavior-y: none;
  -webkit-user-select: none; user-select: none;
  overflow-x: hidden;
}

/* [오류 해결] 오버레이 설정 강화 */
.overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: var(--bg); /* 배경색을 주어 뒤가 안 보이게 함 */
  z-index: 9999; display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.4s ease; pointer-events: none;
}
.overlay.show { opacity: 1; pointer-events: auto; }

h1 { display: block; width: fit-content; margin: 30px auto 0; padding: 12px 28px; font-size: 32px; font-weight: 850; letter-spacing: -1px; background: rgba(163, 177, 138, 0.15); border-radius: 100px; color: var(--text); }
.subtitle { text-align: center; font-size: 13px; color: var(--sub); margin: 8px 0 24px; line-height: 1.5; }

.status { text-align:center; padding:16px; border-radius:18px; background: rgba(163, 177, 138, 0.15); font-size:14px; margin-bottom:20px; transition: 0.3s ease; line-height: 1.6; color: var(--text); }
.status.warn { background:#f7e6e3; color:var(--warn-strong); font-weight: 600; }

.card { scroll-margin-top: 80px; touch-action: manipulation; background:var(--card); border-radius:24px; padding:22px; margin-bottom:16px; box-shadow: 0 6px 20px rgba(0,0,0,0.04); cursor: pointer; border: 1.5px solid transparent; transition: transform 0.2s ease, background-color 0.2s ease; }
.card.open .edit-form { max-height: 600px; opacity: 1; margin-top: 18px; padding-top: 18px; border-top: 1px dashed rgba(0,0,0,0.1); }
.edit-form { max-height: 0; overflow: hidden; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); opacity: 0; }

.history-container { background: rgba(0,0,0,0.03); border-radius: 12px; padding: 10px; margin-bottom: 15px; }
.history-item { font-size: 11px; color: var(--sub); display: flex; justify-content: space-between; margin-bottom: 4px; }

input, button { width:100%; padding:14px; border-radius:14px; margin-top:8px; font-size:16px; border:none; outline: none; }
input { border: 1.5px solid #eee; background: #fafafa; color: var(--text); }
button { background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }

@keyframes fadeInOut {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
  20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
}
.icon-emoji { font-size: 32px; animation: breathe 3.2s ease-in-out infinite; display: inline-block; }
@keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.08); opacity: 1; } }
</style>
</head>
<body>

<div id="overlay" class="overlay">
  <div class="welcome" style="text-align:center; max-width:300px;">
    <h2>🌿 민티의 하루 🌿</h2>
    <p style="font-size:14px; color:var(--sub); line-height:1.8;">✍️ 작은 기록 속에 남기는 나의 온도</p>
    <button onclick="start()">시작하기</button>
  </div>
</div>

<h1>🌿 민티의 하루 🌿</h1>
<div class="subtitle">오늘도 건강할 민티를 위해 😎</div>
<div id="status" class="status"></div>
<div id="cards"></div>

<footer>
  <div style="text-align:center; font-size:11px; color:var(--sub); margin-top:40px;">숫자가 말하지 못하는 것들</div>
  <div id="today" style="text-align:center; font-size:11px; color:var(--sub); opacity:0.5; margin-top:4px;"></div>
</footer>

<script>
const supplements = [
  { key: "pro", name: "유산균", icon: '🦠', desc: "아침 공복, 따뜻한 물과 함께" },
  { key: "vit", name: "종합비타민", icon: '💊', desc: "점심 식후, 잊지 말고 챙기기" },
  { key: "omg", name: "오메가3", icon: '🐟', desc: "점심 식후, 잊지 말고 챙기기" },
  { key: "col", name: "콜라겐", icon: '✨', desc: "오늘 하루를 마무리하며" }
];

function getTodayKST() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function getDiffDays(dateStr) {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const pDateOrigin = new Date(dateStr);
  const pDate = new Date(pDateOrigin.getFullYear(), pDateOrigin.getMonth(), pDateOrigin.getDate());
  return Math.floor((today - pDate) / 86400000);
}

function formatDateShort(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return `${d.getMonth()+1}월 ${d.getDate()}일`;
}

function get(k) { return JSON.parse(localStorage.getItem('minty_' + k)); }
function set(k, v) { localStorage.setItem('minty_' + k, JSON.stringify(v)); }

function render() {
  const sortedSupplements = [...supplements].sort((a, b) => {
    const da = get(a.key), db = get(b.key);
    const ra = da ? Math.max((da.total || 0) - getDiffDays(da.lastDate), 0) : Infinity;
    const rb = db ? Math.max((db.total || 0) - getDiffDays(db.lastDate), 0) : Infinity;
    return ra - rb;
  });

  let warnCount = 0;
  const wrap = document.getElementById("cards");
  wrap.innerHTML = "";
  
  sortedSupplements.forEach(s => {
    const d = get(s.key);
    let remain = "-", historyHtml = "", isWarn = false;

    if (d && d.lastDate) {
      const diff = getDiffDays(d.lastDate);
      remain = Math.max((d.total || 0) - diff, 0);
      isWarn = (remain <= 60);
      if (isWarn) warnCount++;

      if (d.history && d.history.length > 0) {
        historyHtml = `<div class="history-container">`;
        d.history.slice(0, 3).forEach(item => {
          historyHtml += `<div class="history-item"><span>📦 ${formatDateShort(item.date)}</span><span>${item.qty}개 추가</span></div>`;
        });
        historyHtml += `</div>`;
      }
    }

    const card = document.createElement("div");
    card.className = `card ${isWarn ? 'warn' : ''}`;
    card.onclick = (e) => {
      if (e.target.closest('.edit-form')) return;
      const isOpen = card.classList.contains('open');
      document.querySelectorAll('.card').forEach(c => c.classList.remove('open'));
      if (!isOpen) card.classList.add('open');
    };

    card.innerHTML = `
      <div class="card-header" style="display:flex; justify-content:space-between; align-items:center;">
        <div style="display:flex; align-items:center; gap:12px;">
          <span class="icon-emoji">${s.icon}</span>
          <span style="font-weight:700;">${s.name}</span>
        </div>
        <div style="text-align:right;">
          <strong style="font-size:24px; color:var(--accent);">${remain}</strong> <span style="font-size:12px; color:var(--sub);">개</span>
        </div>
      </div>
      <div style="font-size:12px; color:var(--sub); margin-top:4px;">${s.desc}</div>
      <div class="edit-form">
        ${historyHtml || '<div style="font-size:11px; color:var(--sub); margin-bottom:10px;">기록이 없어요 ✨</div>'}
        <div style="font-size:11px; color:var(--sub); margin-bottom:4px;">⏱ 구매 추가 (오늘 기준)</div>
        <input type="date" id="${s.key}d" value="${getTodayKST()}" readonly style="opacity:0.6;">
        <input type="number" inputmode="numeric" placeholder="구매 수량 입력" id="${s.key}q">
        <div style="font-size:11px; color:var(--sub); margin:12px 0 4px;">현재 실재고 보정</div>
        <input type="number" inputmode="numeric" placeholder="현재 정확한 개수" id="${s.key}total">
        <button onclick="save('${s.key}', event)">기록하기 💚</button>
      </div>
    `;
    wrap.appendChild(card);
  });

  const st = document.getElementById("status");
  st.className = "status" + (warnCount ? " warn" : "");
  st.innerText = warnCount ? `⚠️ 준비가 필요한 영양제가 ${warnCount}개 있어요` : "✨ 모든 영양제가 충분해요!";
  document.getElementById("today").innerText = getTodayKST();
}

function save(k, e) {
  e.preventDefault(); e.stopPropagation();
  const qInput = document.getElementById(k + "q").value;
  const totalInput = document.getElementById(k + "total").value;
  const prev = get(k) || { total: 0, lastDate: getTodayKST(), history: [] };

  if (totalInput !== "") {
    prev.total = parseInt(totalInput, 10);
    prev.lastDate = getTodayKST();
  } else if (qInput !== "" && parseInt(qInput) > 0) {
    // [핵심 수정] 오늘 남은 재고에 새로 산 수량을 더함
    const currentRemain = Math.max(prev.total - getDiffDays(prev.lastDate), 0);
    prev.total = currentRemain + parseInt(qInput, 10);
    prev.lastDate = getTodayKST();
    prev.history = [{date: getTodayKST(), qty: parseInt(qInput, 10)}, ...(prev.history || [])].slice(0, 5);
  } else {
    alert("수량을 입력해주세요 💚"); return;
  }

  set(k, prev); render();
  showToast();
  if (navigator.vibrate) navigator.vibrate(10);
  document.querySelectorAll('.card').forEach(c => c.classList.remove('open'));
}

function showToast() {
  const t = document.createElement('div');
  t.innerText = "💚 기록 완료!";
  t.style.cssText = "position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#A3B18A; color:white; padding:16px 32px; border-radius:20px; z-index:10000; animation:fadeInOut 1.5s ease;";
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1500);
}

function start() {
  const o = document.getElementById("overlay");
  o.classList.remove("show");
  setTimeout(() => o.style.display = "none", 400);
}

// 초기화
window.onload = () => {
  render();
  const o = document.getElementById("overlay");
  o.style.display = "flex";
  setTimeout(() => o.classList.add("show"), 50);
};
</script>
</body>
</html>
